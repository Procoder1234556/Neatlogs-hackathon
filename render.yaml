services:
  # ProspectForge FastAPI Backend Service on Render
  - type: web
    name: prospectforge-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: NEATLOGS_API_KEY
        sync: false
      - key: NEATLOGS_ENDPOINT
        value: https://ingest.neatlogs.com
      - key: NEATLOGS_WORKFLOW_NAME
        value: prospectforge-b2b-agent
      - key: CRUSTDATA_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_PROJECT_REF
        value: jbfyxtbyheyuylptreud
      - key: SUPABASE_URL
        value: https://jbfyxtbyheyuylptreud.supabase.co
